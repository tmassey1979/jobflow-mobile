name: Integration state tests

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "Models/IntegrationConnection.cs"
      - "tests/JobFlow.Mobile.IntegrationTests/**"
      - ".github/workflows/integration-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "Models/IntegrationConnection.cs"
      - "tests/JobFlow.Mobile.IntegrationTests/**"
      - ".github/workflows/integration-tests.yml"

permissions:
  contents: read

jobs:
  integration-state-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run integration state tests
        run: dotnet run --project tests/JobFlow.Mobile.IntegrationTests/JobFlow.Mobile.IntegrationTests.csproj --configuration Release
